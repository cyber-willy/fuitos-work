name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Start local app and run health check
        run: |
          npm start > /tmp/fuitos-work.log 2>&1 &
          sleep 10
          node scripts/healthcheck.js
        env:
          PORT: 3000
